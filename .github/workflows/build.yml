name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK to Transfer.sh & Send Link to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            echo "Uploading APK to Transfer.sh..."
            # رفع الملف واستلام الرابط المباشر
            DOWNLOAD_URL=$(curl --upload-file "$APK_PATH" "https://transfer.sh/app-debug.apk")
            echo "Download URL: $DOWNLOAD_URL"
            
            # إرسال الرابط عبر تليجرام
            curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
                 -d chat_id="$TELEGRAM_CHAT_ID" \
                 -d text="تم بناء التطبيق بنجاح 🚀%0Aحمل النسخة من هنا:%0A$DOWNLOAD_URL"
          else
            echo "Error: APK file not found!"
            exit 1
          fi

      - name: Run tests
        continue-on-error: true
        run: gradle testDebugUnitTest --stacktrace
