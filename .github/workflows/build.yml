name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # الـ SDK متثبت أصلاً على runner. بنقبل التراخيص يدوياً بدل setup-android اللي كان بيفشل
      - name: Accept Android SDK licenses
        run: yes | "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NourAI-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # الاختبارات بعد البناء (مش بتمنع الـ APK)، وملف النتايج بيتحمّل لو فيه فشل
      - name: Run tests
        continue-on-error: true
        run: gradle testDebugUnitTest --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
