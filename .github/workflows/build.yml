name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    # 🔑 ده السطر السحري اللي بيحل مشكلة خطأ 403 وصلاحيات الكتابة للريليس
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # الـ SDK متثبت أصلاً على runner. بنقبل التراخيص يدوياً بدل setup-android اللي كان بيفشل
      - name: Accept Android SDK licenses
        run: yes | "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      # خطوة رفع الـ APK لـ GitHub Releases أوتوماتيكياً
      - name: Create Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
          tag_name: v1.0.${{ github.run_number }}
          name: "NourAI Debug v1.0.${{ github.run_number }}"
          body: "تحديث تلقائي جديد لبناء تطبيق NourAI بصيغة Debug."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # خطوة إرسال الرابط مباشرة على بوت التليجرام
      - name: Send Notification to Telegram
        if: always()
        run: |
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/v1.0.${{ github.run_number }}"
          MESSAGE="🚀 **تم بنجاح بناء وتنسيق تحديث NourAI الجديد!**%0A%0A📦 **نوع النسخة:** Debug APK%0A🔗 **رابط التحميل من الريليس:** $RELEASE_URL%0A📌 **رقم البناء (Build):** ${{ github.run_number }}"
          
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
          -d "text=$MESSAGE" \
          -d "parse_mode=Markdown"

      # الاختبارات بعد البناء
      - name: Run tests
        continue-on-error: true
        run: gradle testDebugUnitTest --stacktrace
