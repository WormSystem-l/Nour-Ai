name: Release APK

# بينزل APK على صفحة Releases لما تعمل tag زي: v1.0.0
#   git tag v1.0.0 && git push origin v1.0.0

on:
  push:
    tags: ["v*"]
  # ملاحظة: مش مفعّل workflow_dispatch عن قصد —
  # إصدار GitHub محتاج tag، فالطريقة الصح: اعمل tag وادفعه.

permissions:
  contents: write

jobs:
  release-apk:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test --reporter expanded

      - name: Generate Android scaffold
        run: |
          if [ -d android ]; then
            echo "android/ موجود — هيتم استخدامه زي ما هو."
          else
            flutter create \
              --platforms=android \
              --project-name conanty \
              --org com.conanty \
              "$RUNNER_TEMP/scaffold"
            cp -r "$RUNNER_TEMP/scaffold/android" ./android
          fi

      - name: Build split APKs per ABI
        run: flutter build apk --release --split-per-abi

      - name: List artifacts
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
